name: urn-pool

on:
  # GitHub's own scheduler drops most cron runs under load; an external timer
  # (cron-job.org) calls workflow_dispatch every 2 hours instead. See README.
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "urnpool/**"
      - "config.json"
      - ".github/workflows/**"

permissions:
  contents: write

concurrency:
  group: urn-pool
  cancel-in-progress: false

jobs:
  pool:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      # state/ holds pool.db (accounts + balances). It never enters git:
      # it is restored/saved through the Actions cache instead.
      - name: Restore pool state
        uses: actions/cache@v4
        with:
          path: state
          key: urnpool-state-${{ github.run_id }}
          restore-keys: |
            urnpool-state-

      - name: Run pool pipeline (tick -> Clash -> PushPlus)
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN || vars.PUSHPLUS_TOKEN }}
          PUSHPLUS_TOPIC: ${{ secrets.PUSHPLUS_TOPIC || vars.PUSHPLUS_TOPIC }}
          PYTHONUNBUFFERED: "1"
        run: python -m urnpool pipeline --out sub

      # 订阅地址（国内可达、实时同步、固定 URL）：
      #   https://ghproxy.net/https://raw.githubusercontent.com/Jack-luo1208/ur-auto/sub2/clash.yaml
      # sub2 分支只放根目录一个 clash.yaml，每轮 force-push 覆盖。
      # ghproxy 直连 raw，无 CDN 缓存；jsDelivr purge 会被限流，故不用 CDN。
      - name: Publish subscription to sub2 branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan sub2
          git rm -rf --cached . >/dev/null 2>&1 || true
          cp sub/clash.yaml clash.yaml
          git add -f clash.yaml
          git commit -m "chore: update clash subscription $(date -u +%Y-%m-%dT%H:%MZ)"
          git push --force origin sub2

      - name: Upload run summary (no credentials)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: urn-sub-${{ github.run_number }}
          path: sub/summary.json
          retention-days: 7
