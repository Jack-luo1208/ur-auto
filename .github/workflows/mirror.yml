name: mirror

# Keeps https://github.com/Jack-luo1208/ur-auto in sync with this repository.
# Needs one secret: MIRROR_TOKEN — a PAT with `repo` scope on Jack-luo1208/ur-auto
# (or a fine-grained token with Contents: read/write on that repo).
# Without it the job exits green and does nothing.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Jack-luo1208/ur-auto
        env:
          MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}
        run: |
          if [ -z "$MIRROR_TOKEN" ]; then
            echo "MIRROR_TOKEN not set — skipping mirror. Add it in Settings > Secrets to enable."
            exit 0
          fi
          git remote add target "https://x-access-token:${MIRROR_TOKEN}@github.com/Jack-luo1208/ur-auto.git"
          git push --force target "HEAD:refs/heads/main"
