name: mirror

# 把本仓库同步到 Jack-luo1208/ur-auto（那边才是主跑仓库）。
# 需要的 Secret：MIRROR_TOKEN —— 对 Jack-luo1208/ur-auto 有 Contents: read/write 的 PAT。
# 没配置时：绿灯跳过，不影响主流程。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mirror:
    # 只在备用源仓库执行；镜像仓自身不再回推
    if: github.repository == 'cctrylyj/ur-auto'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check token
        id: pre
        env:
          MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}
        run: |
          if [ -z "$MIRROR_TOKEN" ]; then
            echo "::notice title=mirror skipped::MIRROR_TOKEN 未设置，跳过同步。"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push to Jack-luo1208/ur-auto
        if: steps.pre.outputs.ready == 'true'
        env:
          MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}
        run: |
          export GIT_TERMINAL_PROMPT=0
          TARGET="https://x-access-token:${MIRROR_TOKEN}@github.com/Jack-luo1208/ur-auto.git"
          # 隔离凭据：绝不复用 workflow 自带 token
          GIT="git -c credential.helper= -c http.https://github.com/.extraheader="
          if ! $GIT ls-remote "$TARGET" >/dev/null 2>&1; then
            echo "::error title=mirror denied::MIRROR_TOKEN 读不到 Jack-luo1208/ur-auto（令牌无效或无权限）。"
            exit 1
          fi
          $GIT push --force "$TARGET" "HEAD:refs/heads/main"
          echo "::notice title=mirror ok::已同步到 Jack-luo1208/ur-auto"
